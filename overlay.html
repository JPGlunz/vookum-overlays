<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dealer Offer Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#7b2ff7;          /* Vookum purple — change here or from the control dock */
    --accent-2:#b98cff;
    --gold:#f3cf6b;
    --red:#ff4057;
    --green:#3ee08f;
    --panel:rgba(14,8,26,.88);
  }
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:Inter,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  body.preview{background:repeating-conic-gradient(#2a2a2a 0 25%,#1e1e1e 0 50%) 0 0/40px 40px}

  /* fixed 1080x1920 design canvas, scaled to fit whatever size the OBS source is */
  #root{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0}
  .stage{position:absolute;left:0;right:0;display:flex;justify-content:center}
  .pos-top .stage{top:150px}
  .pos-middle .stage{top:50%;transform:translateY(-50%)}
  .pos-bottom .stage{bottom:170px}

  .scene{display:none;width:960px;flex-direction:column;align-items:center;text-align:center}
  .scene.on{display:flex;animation:sceneIn .45s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes sceneIn{from{opacity:0;transform:scale(.85) translateY(30px)}to{opacity:1;transform:none}}

  .card{position:relative;width:100%;box-sizing:border-box;padding:56px 56px 52px;border-radius:36px;
    background:linear-gradient(160deg,rgba(40,18,74,.92),var(--panel) 55%);
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 3px color-mix(in srgb,var(--accent) 80%,#fff 0%),0 0 60px color-mix(in srgb,var(--accent) 55%,transparent);
    overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);
    transform:translateX(-120%);animation:sheen 3.2s 0.6s ease-in-out infinite}
  @keyframes sheen{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}

  .pill{display:inline-block;padding:14px 34px;border-radius:999px;font:900 34px/1 Inter,sans-serif;letter-spacing:.14em;
    text-transform:uppercase;background:var(--accent);box-shadow:0 0 30px color-mix(in srgb,var(--accent) 70%,transparent)}
  .brand{margin-top:34px;font:800 46px/1.1 Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2)}
  .model{margin-top:10px;font-family:Anton,Impact,sans-serif;font-size:118px;line-height:1.02;text-transform:uppercase;
    background:linear-gradient(180deg,#fff 10%,var(--gold) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));overflow-wrap:normal;word-break:normal}
  .ref{margin-top:14px;font:700 42px/1 Inter,sans-serif;letter-spacing:.08em;color:rgba(255,255,255,.75)}
  .sub{margin-top:30px;font:800 40px/1.2 Inter,sans-serif;color:#fff}
  .sub:empty,.ref:empty,.brand:empty{display:none}
  .photo{display:none;margin:30px auto 0;max-width:560px;max-height:560px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .photo.has{display:block}

  /* offer reveal: staggered */
  #s-offer.on .pill{animation:drop .5s .1s both}
  #s-offer.on .brand{animation:rise .5s .45s both}
  #s-offer.on .model{animation:zoom .7s .7s cubic-bezier(.2,1.5,.4,1) both}
  #s-offer.on .ref,#s-offer.on .photo{animation:rise .5s 1.1s both}
  #s-offer.on .sub{animation:rise .5s 1.3s both}
  @keyframes drop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes zoom{from{opacity:0;transform:scale(1.8);filter:blur(10px)}to{opacity:1;transform:none}}

  /* calling */
  .phone{position:relative;width:240px;height:240px;margin:10px auto 40px}
  .phone .ring{position:absolute;inset:0;border-radius:50%;border:6px solid var(--accent-2);animation:ripple 1.6s ease-out infinite}
  .phone .ring:nth-child(2){animation-delay:.53s}.phone .ring:nth-child(3){animation-delay:1.06s}
  @keyframes ripple{from{transform:scale(.7);opacity:1}to{transform:scale(1.7);opacity:0}}
  .phone .core{position:absolute;inset:20px;border-radius:50%;background:var(--accent);display:grid;place-items:center;
    box-shadow:0 0 50px var(--accent)}
  .phone svg{width:110px;height:110px;animation:shake .9s ease-in-out infinite}
  @keyframes shake{0%,50%,100%{transform:rotate(0)}5%,15%,25%,35%{transform:rotate(-16deg)}10%,20%,30%,40%{transform:rotate(16deg)}}
  .big{font-family:Anton,Impact,sans-serif;font-size:132px;line-height:1;text-transform:uppercase;text-shadow:0 6px 0 rgba(0,0,0,.4),0 0 40px color-mix(in srgb,var(--accent) 70%,transparent)}
  #s-calling .big{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.75;transform:scale(.97)}}

  /* accepted / declined stamps */
  .stamp{font-family:Anton,Impact,sans-serif;font-size:150px;line-height:.95;text-transform:uppercase;padding:18px 40px 26px;
    border:10px solid currentColor;border-radius:28px;transform:rotate(-5deg);background:rgba(10,6,18,.75);
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #s-accepted .stamp{color:var(--green);text-shadow:0 0 40px rgba(62,224,143,.6)}
  #s-declined .stamp{color:var(--red);text-shadow:0 0 40px rgba(255,64,87,.6)}
  #s-accepted.on .stamp,#s-declined.on .stamp{animation:slam .55s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes slam{from{opacity:0;transform:rotate(-5deg) scale(2.6)}70%{opacity:1}to{opacity:1;transform:rotate(-5deg) scale(1)}}
  .after{margin-top:46px;width:100%}
  #s-accepted.on .after,#s-declined.on .after{animation:rise .5s .55s both}
  .struck{position:relative;display:inline-block}
  .struck::after{content:"";position:absolute;left:-3%;right:-3%;top:52%;height:12px;border-radius:6px;background:var(--red);
    transform-origin:left;transform:scaleX(0) rotate(-4deg);box-shadow:0 0 20px var(--red)}
  #s-declined.on .struck::after{animation:strike .45s 1s ease-out forwards}
  @keyframes strike{to{transform:scaleX(1) rotate(-4deg)}}
  #s-declined .model{background:linear-gradient(180deg,#fff,#cbbfe0);-webkit-background-clip:text;background-clip:text}
  #s-declined.on .model{animation:dim .4s 1.3s forwards}
  @keyframes dim{to{opacity:.55}}

  canvas#fx{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body class="pos-top">
<div id="root">
<canvas id="fx" width="1080" height="1920"></canvas>
<div class="stage">

  <section class="scene" id="s-calling">
    <div class="phone"><div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="core"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div>
    </div>
    <div class="big" data-t="callingText"></div>
    <div class="sub" data-t="callingSub"></div>
  </section>

  <section class="scene" id="s-offer">
    <div class="card">
      <div class="pill" data-t="offerLabel"></div>
      <div class="brand" data-f="brand"></div>
      <div class="model fit" data-f="model"></div>
      <div class="ref" data-f="ref"></div>
      <img class="photo" alt="">
      <div class="sub" data-t="offerSub"></div>
    </div>
  </section>

  <section class="scene" id="s-accepted">
    <div class="stamp" data-t="acceptTitle"></div>
    <div class="card after">
      <div class="brand" data-f="brand"></div>
      <div class="model fit" data-f="model"></div>
      <div class="ref" data-f="ref"></div>
      <div class="sub" data-t="acceptSub"></div>
    </div>
  </section>

  <section class="scene" id="s-declined">
    <div class="stamp" data-t="declineTitle"></div>
    <div class="card after">
      <div class="brand" data-f="brand"></div>
      <div class="struck"><div class="model fit" data-f="model"></div></div>
      <div class="sub" data-t="declineSub"></div>
    </div>
  </section>

</div>
</div>
<script>
(function fit(){const r=document.getElementById('root');
  const go=()=>{const k=Math.min(innerWidth/1080,innerHeight/1920);r.style.transform=`scale(${k}) translate(-50%,-50%)`};
  go();addEventListener('resize',go)})();
const KEY='vk-dealer-state', CH='vk-dealer';
const DEFAULT_WORDING={
  callingText:'The Dealer|is calling…', callingSub:'{who}',
  offerLabel:"The Dealer's Offer", offerSub:'{who}',
  acceptTitle:'Offer|Accepted', acceptSub:'Box swapped for the watch!',
  declineTitle:'Offer|Declined', declineSub:'Open the box!'
};
const params=new URLSearchParams(location.search);
const STATIC=params.has('scene');               // fixed-scene mode for separate OBS sources
if(params.has('preview')) document.body.classList.add('preview');
let sound=params.get('sound')!=='0';
let current={scene:'none',nonce:0};

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// wording allows <br> only; everything else escaped. "|" also = line break.
function wording(s){return esc(s).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/\|/g,'<br>')}
function fill(tpl,s){return tpl.replace(/\{(\w+)\}/g,(_,k)=>s[k]||'')}

function fitText(el){
  el.style.fontSize='';
  let size=parseFloat(getComputedStyle(el).fontSize);
  const over=()=>el.scrollHeight>size*1.02*2+6 || el.scrollWidth>el.clientWidth+2;   // max two lines, no broken words
  while(size>48 && over()){size-=4;el.style.fontSize=size+'px'}
}

function apply(s){
  const w=Object.assign({},DEFAULT_WORDING,s.wording||{});
  document.documentElement.style.setProperty('--accent',s.accent||'#7b2ff7');
  if(s.accent2) document.documentElement.style.setProperty('--accent-2',s.accent2);
  document.body.classList.remove('pos-top','pos-middle','pos-bottom');
  document.body.classList.add('pos-'+(s.pos||'top'));
  document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=wording(fill(w[el.dataset.t]||'',s)));
  document.querySelectorAll('[data-f]').forEach(el=>el.textContent=s[el.dataset.f]||'');
  const img=document.querySelector('#s-offer .photo');
  if(s.photo){img.src=s.photo;img.classList.add('has')}else{img.removeAttribute('src');img.classList.remove('has')}

  const changed=s.scene!==current.scene||s.nonce!==current.nonce;
  document.querySelectorAll('.scene').forEach(el=>{
    const on=el.id==='s-'+s.scene;
    if(on&&changed){el.classList.remove('on');void el.offsetWidth}
    el.classList.toggle('on',on);
  });
  document.querySelectorAll('.scene.on .fit').forEach(fitText);
  if(changed){
    stopFx();
    if(s.scene==='accepted') confetti();
    if(sound && s.sound!==false) play(s.scene);
  }
  current={scene:s.scene,nonce:s.nonce};
}

/* ---------- sync ---------- */
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
if(STATIC){
  const s={scene:params.get('scene'),nonce:1,brand:params.get('brand')||'',model:params.get('model')||'',
    ref:params.get('ref')||'',who:params.get('who')||'',photo:params.get('photo')||'',pos:params.get('pos')||'top',accent:params.get('accent')||undefined,wording:{}};
  for(const k in DEFAULT_WORDING) if(params.has(k)) s.wording[k]=params.get(k);
  document.fonts.ready.then(()=>apply(s));
}else{
  const init=load(); if(init){init.scene='none'; apply(init);}
  try{new BroadcastChannel(CH).onmessage=e=>document.fonts.ready.then(()=>apply(e.data))}catch(e){}
  addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{apply(JSON.parse(e.newValue))}catch(_){}}});
}

/* ---------- confetti ---------- */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],raf=0,fxEnd=0;
function confetti(){
  const cols=['#f3cf6b','#ffffff',getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#7b2ff7','#3ee08f','#b98cff'];
  parts=[];for(let i=0;i<260;i++)parts.push({x:540+(Math.random()-.5)*200,y:700,vx:(Math.random()-.5)*26,vy:-Math.random()*30-8,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:10+Math.random()*12,h:6+Math.random()*8,c:cols[i%cols.length]});
  fxEnd=performance.now()+5200;cancelAnimationFrame(raf);tick();
}
function tick(){
  cx.clearRect(0,0,1080,1920);
  for(const p of parts){p.vy+=.7;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  if(performance.now()<fxEnd) raf=requestAnimationFrame(tick); else cx.clearRect(0,0,1080,1920);
}
function stopFx(){cancelAnimationFrame(raf);cx.clearRect(0,0,1080,1920);parts=[]}

/* ---------- synthesized stings (no samples, nothing licensed) ---------- */
let ac;function A(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,d,type='sine',g=.18,f2){const a=A(),o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);v.gain.setValueAtTime(0,a.currentTime+t0);
  v.gain.linearRampToValueAtTime(g,a.currentTime+t0+.02);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);
  o.connect(v).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
function play(scene){try{
  if(scene==='calling'){for(let r=0;r<2;r++)for(let i=0;i<10;i++){tone(440,r*1.6+i*.05,.05,'sine',.12);tone(480,r*1.6+i*.05,.05,'sine',.12)}}
  if(scene==='offer'){[392,494,587,784].forEach((f,i)=>tone(f,i*.11,.5,'triangle',.16));tone(1568,.5,.9,'sine',.07)}
  if(scene==='accepted'){[523,659,784,1047].forEach(f=>tone(f,0,1.4,'triangle',.12));[1319,1568,2093].forEach((f,i)=>tone(f,.25+i*.08,.6,'sine',.06))}
  if(scene==='declined'){tone(220,0,.5,'sawtooth',.12,110);tone(165,.22,.7,'square',.08,82)}
}catch(e){}}
</script>
</body>
</html>
